<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Fix the table crop</title><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:#1d2228;color:#eef1f4}
header{padding:10px 14px}header b{font-size:17px}header p{margin:4px 0 0;color:#aab3bd;font-size:13px}
#wrap{position:relative;margin:0 auto;max-width:1000px;touch-action:none}#ph{width:100%;display:block;user-select:none;-webkit-user-drag:none}
svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.h{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:#ff3cd2cc;border:3px solid #fff;box-shadow:0 1px 6px #0009;touch-action:none;cursor:grab;transition:transform .15s}
.h.on{transform:scale(1.25)}.h span{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;white-space:nowrap;text-shadow:0 0 3px #000}
#loupe{position:fixed;width:150px;height:150px;border-radius:50%;border:3px solid #fff;box-shadow:0 4px 16px #000a;pointer-events:none;display:none;background-repeat:no-repeat;z-index:9}
#loupe:after{content:"";position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border:2px solid #ff3cd2;border-radius:50%}
.bar{display:flex;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
button{flex:1;font:inherit;font-weight:600;border:0;border-radius:12px;padding:13px;background:#36404a;color:#fff}button.go{background:#2f8f6f}
#out{display:none;margin:0 14px 16px;padding:12px;background:#0f1317;border-radius:10px;font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap;word-break:break-all}
</style></head><body>
<header><b>Fix the table crop</b><p>Drag each pink dot to the real corner of the tabletop. For a rounded corner, put the dot where the two straight edges would meet. While you drag, a magnified view shows above your finger.</p></header>
<div id="wrap"><img id="ph" src="photo.jpg" alt="table photo"><svg viewBox="0 0 1 1" preserveAspectRatio="none"><polygon id="poly" fill="rgba(255,60,210,.10)" stroke="#ffe14d" stroke-width=".003"/></svg></div>
<div id="loupe"></div>
<div class="bar"><button id="reset">Reset to automatic</button><button class="go" id="done">Done</button></div>
<pre id="out"></pre>
<script>
const W0=__W0__,H0=__H0__,AUTO=__AUTO__,names=["top-left","top-right","bottom-right","bottom-left"];
const wrap=document.getElementById('wrap'),ph=document.getElementById('ph'),poly=document.getElementById('poly'),loupe=document.getElementById('loupe');
let pts=JSON.parse(localStorage.getItem('fixcrop')||'null')||AUTO.map(p=>[p[0]/W0,p[1]/H0]);
const hs=pts.map((p,i)=>{const d=document.createElement('div');d.className='h';d.innerHTML='<span>'+names[i]+'</span>';wrap.appendChild(d);return d});
function draw(){hs.forEach((d,i)=>{d.style.left=(pts[i][0]*100)+'%';d.style.top=(pts[i][1]*100)+'%'});poly.setAttribute('points',pts.map(p=>p.join(',')).join(' '))}
function showLoupe(i,cx,cy){const r=ph.getBoundingClientRect(),z=4;loupe.style.display='block';loupe.style.left=(cx-75)+'px';loupe.style.top=Math.max(4,cy-200)+'px';
 loupe.style.backgroundImage='url(photo.jpg)';loupe.style.backgroundSize=(r.width*z)+'px '+(r.height*z)+'px';loupe.style.backgroundPosition=(-(pts[i][0]*r.width*z-75))+'px '+(-(pts[i][1]*r.height*z-75))+'px'}
hs.forEach((d,i)=>{d.addEventListener('pointerdown',e=>{d.setPointerCapture(e.pointerId);d.classList.add('on');showLoupe(i,e.clientX,e.clientY)});
 d.addEventListener('pointermove',e=>{if(!d.hasPointerCapture(e.pointerId))return;const r=ph.getBoundingClientRect();
  pts[i]=[Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))];draw();showLoupe(i,e.clientX,e.clientY)});
 d.addEventListener('pointerup',()=>{d.classList.remove('on');loupe.style.display='none';localStorage.setItem('fixcrop',JSON.stringify(pts))})});
document.getElementById('reset').onclick=()=>{pts=AUTO.map(p=>[p[0]/W0,p[1]/H0]);localStorage.removeItem('fixcrop');draw();document.getElementById('out').style.display='none'};
document.getElementById('done').onclick=async()=>{const c=pts.map(p=>[Math.round(p[0]*W0),Math.round(p[1]*H0)]);const txt=JSON.stringify({photo:"whole table",corners:c});
 const o=document.getElementById('out');o.style.display='block';o.textContent='Corners saved:\n'+txt;try{await navigator.clipboard.writeText(txt);o.textContent+='\n\n(Copied. Paste it to Claude.)'}catch(e){o.textContent+='\n\nCopy this and paste it to Claude.'}};
ph.complete?draw():ph.onload=draw;window.onresize=draw;
</script></body></html>
